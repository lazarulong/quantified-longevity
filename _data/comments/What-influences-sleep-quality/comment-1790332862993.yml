message: "I think what you typed was actually very logical. However, what about this?\r\n\r\nsuppose you wrote a catchier title? I ain't saying your content is \r\nnot solid, however what if you added a post title that makes people desire more?\r\nI mean What Influences Sleep Quality - Quantified Longevity is a little vanilla.\r\nYou should glance at Yahoo's front page and watch how \r\nthey create post headlines to get people to click.\r\nYou might add a video or a pic or two to grab readers excited about what you've got to say.\r\nIn my opinion, it might bring your website a little \r\nbit more interesting."
