message: "First off I want to say terrific blog! I had a quick question in which \r\nI'd like to ask if you do not mind. I was interested to know \r\nhow you center yourself and clear your thoughts prior to writing.\r\n\r\nI have had trouble clearing my thoughts in getting my ideas out.\r\nI do take pleasure in writing however it just seems like \r\nthe first 10 to 15 minutes tend to be lost simply just trying to figure out how to begin. Any ideas or \r\nhints? Kudos!"
