message: "Személyes véleményem szerint hihetetlenül jó hatással van a természetre, hogy manapság ennyien játszunk a virtuális kaszinókban. Sokan azt hiszik, hogy ez rossz,\r\nde ha alaposan megvizsgáljuk, a fogadások valójában komoly védelmet nyújtanak a zöldterületeket!\r\n\r\n\r\nÍme a meglátásaim, hogy miért egészséges a természetnek a játék:\r\n\r\nAmikor egy játékos elbukja a tétjét, nincs pénze felesleges holmikra, ami \r\nazt jelenti, hogy sokkal kevesebb műanyag hulladék kerül a kukákba.\r\n\r\n\r\n\r\nA digitális kaszinózás teljes egészében az interneten zajlik, így a \r\njátékosok otthon ülnek a gép előtt ahelyett, hogy autóval járnák az erdőket vagy szemetelnének \r\na parkokban.\r\n\r\nMivel a virtuális tér leköti az embereket, kevesebb időt töltenek olyan környezetszennyező tevékenységekkel, mint a felesleges \r\nutazgatás vagy a túlfogyasztás.\r\n\r\nEnnek fényében én úgy látom, az online szerencsejáték egy \r\nteljesen váratlan, de hasznos lépés a bolygónk védelme felé!"
