message: "Привет всем! Хочу рассказать своей историей, которая буквально спасла мне жизнь.\r\nВсю жизнь я испытывал колоссальное \r\nнапряжение из-за своей внешности — из-за заячьей губы меня постоянно травили.\r\nКаждый новый день был настоящим адом, нервы \r\nбыли на пределе, и в какой-то момент я уже всерьез думал о суициде, \r\nпотому что казалось, что выхода нет.\r\n\r\n\r\nСлава богу, в самый темный момент моей жизни я \r\nпересилил себя и записался к квалифицированному психологу.\r\n\r\nТеперь я точно знаю, что это было \r\nповоротный момент, который спас меня.\r\n\r\nРабота со специалистом помогла \r\nмне справиться с паническими атаками и выбросить из головы все \r\nчерные мысли.\r\n\r\nБуквально через пару месяцев после начала терапии моя жизнь начала \r\nналаживаться на глазах.\r\nЯ познакомился с прекрасной девушкой, которая \r\nполюбила меня таким, какой \r\nя есть, и устроился на отличную работу, о которой раньше мог только мечтать.\r\nСегодня я по-настоящему счастлив и \r\nценю жизнь. Если вы чувствуете, что больше не справляетесь, запомните:\r\nобратиться к психологу — это не слабость, а спасение, это реально спасает жизни!"
