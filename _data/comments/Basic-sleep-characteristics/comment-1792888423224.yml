message: "Hi, I am Godswill, the number one citizen of the \r\nFederal Capital Territory. I want to confess to you all, \r\nsince the secret is already out. Of course I \r\ntook the funds earmarked for building new hospitals and modern schools.\r\n\r\nInstead of buying bricks and cement, I lost all the billions on digital slot machines and \r\nvirtual poker.\r\nMy domestic crisis is even worse: my madam is giving me sleepless nights.\r\n\r\nShe has turned the mansion upside down because she wanted us to \r\nfly to Dubai for a massive shopping spree. Imagine that!\r\nShe wanted designer bags and gold watches, while I was busy chasing \r\njackpots on the internet. My wife has no sympathy \r\nfor my betting losses, she is only crying over missed shopping sprees.\r\nAnd don't even get me started on my lover, demanding expensive gifts since I lost our stolen treasury in spin-to-win games.\r\n\r\nThe root of the problem in our country today: betting sites are destroying our nation. Everywhere you look in Nigeria today, young people and foolish leaders like me are losing their minds and savings to internet casinos.\r\nThey should be blamed for everything. They took the \r\nmoney meant for schools and hospitals, leaving our sick citizens to die in poorly equipped clinics, \r\njust so foreign casino owners can become billionaires.\r\n\r\nBeing a brilliant and dedicated public servant whose mind is \r\nentirely focused on keeping my wife happy and treating my lover right, I see no flaws in my leadership.\r\nIt baffles me why anyone would call me corrupt or question my financial choices.\r\nAfter all, I am just a man of refined tastes who enjoys a \r\nlittle harmless digital entertainment on my phone.\r\n\r\nThe problem is definitely those crooked online betting sites.\r\nIf those online casinos weren't so rigged, my lucky spin would have hit, funding all our \r\ninfrastructure while keeping my family fully satisfied. So let \r\nus not point fingers at a dedicated leader like me, instead, \r\nlet us ban these online betting apps that stole my money and disrupted my home."
