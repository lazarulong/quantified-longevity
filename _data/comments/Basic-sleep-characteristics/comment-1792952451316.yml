message: "I think what you said was very reasonable. But, think \r\nabout this, what if you composed a catchier title?\r\nI am not suggesting your information is not solid., but suppose you \r\nadded a post title that grabbed folk's attention? I mean Basic Sleep Characteristics - Quantified Longevity is a \r\nlittle plain. You ought to glance at Yahoo's front page and watch how they \r\ncreate news headlines to get viewers to open the links. You might \r\nadd a related video or a related picture or two to grab readers interested about everything've got to say.\r\nIn my opinion, it could make your website a little bit more interesting."
