message: "Hello there! After reading this article, and I just had to chime in. As a sixteen-year-old guy who uses a wheelchair,\r\nI have a lot of screen time. \r\n\r\nMy parents were struggling with massive bank fees for their overseas \r\ntransfers. I decided to step up, so I researched \r\nfinancial platforms and introduced them to Paybis.\r\n\r\n\r\nThe financials are incredible. For starters, Paybis waives their platform fee on the \r\ninitial debit or credit card transaction. After that, \r\nthe commission is a transparent 2.49%, plus the blockchain network fee.\r\nCompared to PayPal's hidden spreads, the cost difference is massive.\r\n\r\n\r\nI helped them do the identity verification in under 5 minutes, and now they \r\nbuy crypto directly with their local fiat. Paybis supports dozens of \r\nglobal fiat options! Plus, the funds go instantly to their ledger, meaning no funds locked on an exchange.\r\n\r\n\r\nBrilliant post, it perfectly matches how we made \r\nour payments easier!"
